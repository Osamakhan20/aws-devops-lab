
name: AWS SSM Remote Command Test

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  test-ssm:
    runs-on: ubuntu-latest

    env:
      INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}

    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::805425385668:role/GitHubActions-DevOpsLab-Deploy
          aws-region: us-east-1

      - name: Execute command on EC2
        run: |
          set -e

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters '{"commands":["echo Hello from GitHub Actions","whoami","docker ps"]}' \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json
