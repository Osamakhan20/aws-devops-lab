
name: Docker CI/CD

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build -t aws-devops-web:ci ./process-lab

      - name: Start container
        run: docker run -d --name ci-web -p 127.0.0.1:8080:80 aws-devops-web:ci

      - name: Test website
        run: |
          for i in {1..10}; do
            if curl --fail --silent http://127.0.0.1:8080/ | grep -Fq "devops-health-check"; then
              echo "Website test passed!"
              exit 0
            fi
            sleep 2
          done
          docker logs ci-web
          exit 1

  publish:
    needs: build-and-test
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: ./process-lab
          push: true
          tags: |
            ghcr.io/osamakhan20/aws-devops-web:latest
            ghcr.io/osamakhan20/aws-devops-web:${{ github.sha }}



            
  deploy:
    needs: publish
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Authenticate with AWS
        uses: aws-actions/configure-aws-credentials@v6.3.0
        with:
          role-to-assume: arn:aws:iam::805425385668:role/GitHubActions-DevOpsLab-Deploy
          aws-region: us-east-1

      - name: Deploy to EC2 through SSM
        env:
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          IMAGE: ghcr.io/osamakhan20/aws-devops-web:${{ github.sha }}
        run: |
          set -euo pipefail
          : "${INSTANCE_ID:?Missing EC2_INSTANCE_ID variable}"

         
    COMMANDS=$(jq -n --arg image "$IMAGE" '{
      commands: [
        "set -eu",
       ("docker pull " + $image),
      "docker rm -f devops-web || true",
       ("docker run -d --name devops-web --restart unless-stopped -p 80:80 " + $image),
       "curl -fsS http://127.0.0.1/ | grep -Fq devops-health-check"
      ]
        }')


          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --parameters "$COMMANDS" \
            --query 'Command.CommandId' \
            --output text)

          echo "SSM Command: $COMMAND_ID"

          if ! aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$INSTANCE_ID" || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --query '{Status:Status,Output:StandardOutputContent}' \
            --output json

